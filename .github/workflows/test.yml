# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test_ubuntu:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ${{ matrix.os }}
    env:
      ROCKSPEC: rockspecs/luautf8-scm-1.rockspec
    strategy:
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4.8", "5.5.0", "luajit-openresty"]
        os: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@master
      - name: Setup LCov
        uses: hrishikesh-kadam/setup-lcov@v1
      - name: Install Lua ${{ matrix.luaVersion }}
        uses: leafo/gh-actions-lua@master
        with:
          luaVersion: ${{ matrix.luaVersion }}
      - name: Install Luarocks
        uses: leafo/gh-actions-luarocks@master
        with:
          luarocksVersion: "3.13.0"
      - name: Build
        run: |
          luarocks make $ROCKSPEC CFLAGS="-O3 -fPIC -Wall -Wextra --coverage" LIBFLAG="-shared --coverage"
      - name: Run Tests
        run: |
          lua test.lua && lua test_pm.lua && lua test_compat.lua
      - name: Run LCov
        run: |
          mkdir -p coverage
          lcov -c -d . -o coverage/lcov.info.all
          lcov -r coverage/lcov.info.all '/usr/*' -o coverage/lcov.info
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-${{ matrix.luaVersion }}
          fail-on-error: false
          parallel: true
  finish:
    needs: test_ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
        fail-on-error: false
